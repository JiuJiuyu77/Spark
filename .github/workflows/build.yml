name: build

# Spark —— iOS 原生 App 的云端构建
#
# 为什么必须 macos runner：Spark 是链接 UIKit 的 iOS 应用，只能由 Xcode 的
# iPhoneOS SDK + ld64 产出 Mach-O；Linux 跑不了。
#
# 触发方式：
#   · push / PR / tag：自动构建并留档产物
#   · workflow_dispatch：给手机端 Spark（或 Cloudflare Worker）远程触发
#
# 产物：Spark-<版本>-<arch>.ipa、*.app.zip、SHA256SUMS.txt

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Spark 任务号（远程触发时由 Worker 传入）'
        required: false
        default: ''
      note:
        description: '备注（会在 Actions 列表里显示）'
        required: false
        default: ''
      options_json:
        description: '构建选项 JSON'
        required: false
        default: '{}'

permissions:
  contents: write
  actions: write

# 注意：这里刻意不用 cancel-in-progress —— macOS runner 排队很慢，
# 中途取消会把已经排到队的任务一起废掉，重跑又得再等十分钟。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. 逻辑层测试：ShareKit + Worker，跑在 ubuntu 上，几十秒
  # ---------------------------------------------------------------------------
  test:
    name: Logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: |
          node --test ShareKit/test/model.test.mjs
          node --test ProjectKit/test/trollinject.test.mjs
          node --test ProjectKit/test/mcp.test.mjs
          node --test ProjectKit/test/mcp-loopback.test.mjs
          node --test Workers/test/worker.test.mjs
      - name: Worker syntax
        run: node --check Workers/SPCloudWorker.js
      - name: Toolchain detector smoke
        run: node scripts/detect-toolchain.mjs --json | head -c 300

  # ---------------------------------------------------------------------------
  # 2. 真机构建：macOS runner 上用 iPhoneOS SDK 编译 Spark
  # ---------------------------------------------------------------------------
  build:
    name: Build Spark (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    env:
      SCHEME: Spark
      BUNDLE_ID: com.HuQing.Spark
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          echo "archs: $(uname -m)"

      - name: Inject build info
        id: info
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^Version: *//p' control | head -1)"
          VERSION="${VERSION:-1.0.0}"
          GIT="$(git describe --tags --always --dirty)"
          WHEN="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "git=$GIT" >> "$GITHUB_OUTPUT"
          echo "when=$WHEN" >> "$GITHUB_OUTPUT"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Native/Resources/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Native/Resources/Info.plist
          plutil -replace SPGitDescribe -string "$GIT" Native/Resources/Info.plist
          plutil -replace SPBuildDate -string "$WHEN" Native/Resources/Info.plist
          echo "版本 $VERSION / $GIT"

      # -----------------------------------------------------------------------
      # 直接 xcrun clang 手工编译：仓库不放 .xcodeproj，
      # 编译细节全在这个脚本里，PR diff 干净、也方便对着日志排错。
      # -----------------------------------------------------------------------
      # -----------------------------------------------------------------------
      # 内置工具链（方案 B：工具链全内置，SDK 由用户导入）
      #   TOOLCHAIN_SOURCE 三种形态：
      #     1) https://.../toolchain.tar.gz —— 从 Release 附件拉取（推荐）
      #     2) 仓库内 Native/Resources/Toolchain 已存在 —— 直接用
      #     3) 都没有 —— 构建出「不含工具链」的瘦包，App 里会提示导入
      # -----------------------------------------------------------------------
      - name: Prepare bundled toolchain
        id: tc
        run: |
          set -euo pipefail
          TC="Native/Resources/Toolchain"

          # 默认从 Spark-Runtime 拿 Theos（含 16.5 + 17.0 双 SDK）
          # 可用仓库变量 TOOLCHAIN_SOURCE 覆盖为任意直链
          SRC="${{ vars.TOOLCHAIN_SOURCE }}"
          if [ -z "$SRC" ]; then
            SRC="https://github.com/JiuJiuyu77/Spark-Runtime/releases/download/runtime-v1/SparkTheosRuntime.tar.gz"
            # 与 Spark-Runtime 上传时一致的 sha256（见 docs/runtime-decision.md）
            TC_SHA="3547bbd074b3b379713be82200ad3347bfec0884cd017916644a9679be5b2ab9"
          fi

          if [ -d "$TC/theos/bin" ]; then
            echo "仓库内已有工具链"
          else
            echo "下载：$SRC"
            mkdir -p "$TC"

            # 三个源**并发竞速**，谁先下完用谁。
            # 之前是串行 for 循环 + 每个 max-time 600，最坏要等 30 分钟，
            # 会拖到任务被取消（实测 15 分钟就 cancelled）。
            # 这里总时限 480 秒，超时就杀掉全部下载并失败。
            # 三个源**并发竞速**，谁先完整下完用谁。
            # 之前串行 + 每个 max-time 600，最坏 30 分钟，会拖到任务取消。
            #
            # 注意判定方式：**必须看 curl 的退出码**。
            # 用「文件大小两次采样相同」判断会有误判 —— 下载中途也可能
            # 恰好两次采样一样（实测 14MB 就被误采纳）。
            rm -f /tmp/tc.*.tar.gz /tmp/tc.*.done
            i=0
            for U in "$SRC" "https://gh-proxy.org/$SRC" "https://ghproxy.net/$SRC"; do
              i=$((i + 1))
              (
                if curl -fsSL --retry 1 --max-time 480 -o "/tmp/tc.$i.tar.gz" "$U"; then
                  : > "/tmp/tc.$i.done"
                fi
              ) &
            done

            ok=0
            deadline=$((SECONDS + 500))
            while [ $SECONDS -lt $deadline ]; do
              # 只认「curl 成功退出」的那份
              for f in /tmp/tc.*.done; do
                [ -f "$f" ] || continue
                n=$(basename "$f" .done)   # tc.N
                src="/tmp/$n.tar.gz"
                [ -s "$src" ] || continue
                sz=$(stat -c%s "$src")
                echo "  采用 $n（$((sz / 1048576)) MB）"
                mv "$src" /tmp/tc.tar.gz
                ok=1
                break
              done
              [ "$ok" = "1" ] && break
              sleep 3
            done
            for pid in $(jobs -p); do kill "$pid" 2>/dev/null || true; done
            rm -f /tmp/tc.*.tar.gz /tmp/tc.*.done

            if [ "$ok" != "1" ]; then
              echo "::error::工具链下载失败（并发三源，500 秒内没有完整下载）"
              exit 1
            fi
            echo "  下载耗时约 $SECONDS 秒"
            # 完整性校验：下载被截断会导致 libLLVM 等大文件残缺，
            # 进而让 ldid -s 报 "size <= mach_header.GetSize()"
            echo "  压缩包大小: $(stat -f%z /tmp/tc.tar.gz 2>/dev/null || stat -c%s /tmp/tc.tar.gz) 字节"
            echo "  期望 sha256: $TC_SHA"
            ACTUAL_SHA=$(shasum -a 256 /tmp/tc.tar.gz | cut -d' ' -f1)
            echo "  实际 sha256: $ACTUAL_SHA"
            if [ -n "$TC_SHA" ] && [ "$ACTUAL_SHA" != "$TC_SHA" ]; then
              echo "::error::工具链包 sha256 不匹配，下载不完整"
              exit 1
            fi

            tar xzf /tmp/tc.tar.gz -C "$TC"
            # 解包后检查关键大文件是否完整（108MB 的 libLLVM）
            LLVM=$(find "$TC" -name 'libLLVM-16.dylib' | head -1)
            if [ -n "$LLVM" ]; then
              SZ=$(stat -f%z "$LLVM" 2>/dev/null || stat -c%s "$LLVM")
              echo "  libLLVM-16.dylib: $((SZ / 1048576)) MB"
              if [ "$SZ" -lt $((100 * 1048576)) ]; then
                echo "::error::libLLVM-16.dylib 只有 $((SZ / 1048576)) MB（应约 108MB），解包不完整"
                exit 1
              fi
            fi
            rm -f /tmp/tc.tar.gz
          fi

          # rootfs 结构：usr/bin（clang/ld64/ldid/perl）+ theos/（makefiles + SDK）
          ls "$TC" || true
          du -sh "$TC"/* 2>/dev/null || true

          # Theos 本体
          THEOSDIR=""
          for c in "$TC/theos" "$TC/TheosRuntime/theos"; do
            [ -d "$c" ] && { THEOSDIR="$c"; break; }
          done
          [ -n "$THEOSDIR" ] || { echo "::error::包里没有 theos/ 目录"; exit 1; }
          [ -f "$THEOSDIR/bin/logos.pl" ] || { echo "::error::缺 logos.pl"; exit 1; }
          ls "$THEOSDIR/sdks"/iPhoneOS*.sdk >/dev/null 2>&1 || { echo "::error::缺 SDK"; exit 1; }

          # 编译链：clang-16 / ld64 / ldid / perl 必须在，否则 make 跑到链接就挂
          BINDIR=""
          for c in "$TC/usr/bin" "$TC/TheosRuntime/usr/bin" "$TC/bin"; do
            [ -d "$c" ] && { BINDIR="$c"; break; }
          done
          [ -n "$BINDIR" ] || { echo "::error::包里没有 usr/bin 或 bin（缺编译链）"; exit 1; }
          for b in clang-16 ld64 ldid perl; do
            if [ -f "$BINDIR/$b" ]; then echo "  ✓ $b"; else echo "::error::编译链缺 $b"; exit 1; fi
          done

          # perl5 模块目录
          PERLDIR=""
          for c in "$TC/usr/lib/perl5" "$TC/TheosRuntime/usr/lib/perl5" "$TC/lib/perl5"; do
            [ -d "$c" ] && { PERLDIR="$c"; break; }
          done
          [ -n "$PERLDIR" ] && echo "  ✓ perl5" || echo "::warning::没有 perl5 模块，logos .x 可能预处理失败"

          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "toolchain_root=$TC" >> "$GITHUB_OUTPUT"

      - name: Compile (plain clang, no Xcode project)
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK = $SDK"
          MIN=15.0
          APP="$RUNNER_TEMP/$SCHEME.app"
          rm -rf "$APP" && mkdir -p "$APP"

          echo "==> 资源"
          # Info.plist 转成二进制（HIG/工具链都认，体积更小）
          cp Native/Resources/Info.plist "$APP/Info.plist"
          plutil -convert binary1 "$APP/Info.plist"

          # App 图标（.app 根目录 + Assets.car 生成前先用扁平 png 兜底）
          cp Native/Resources/AppIcon*.png "$APP/" 2>/dev/null || true

          # 本地化
          if [ -d Native/Resources/en.lproj ]; then
            cp -R Native/Resources/en.lproj "$APP/"
          fi

          # 资源目录（如 Assets.xcassets 里还有其它资源）
          if [ -d Native/Resources/Assets.xcassets ]; then
            cp -R Native/Resources/Assets.xcassets "$APP/Assets.xcassets.tmp"
            rm -rf "$APP/Assets.xcassets.tmp"
          fi

          # 内置工具链：整目录拷进 .app/Toolchain
          if [ -d Native/Resources/Toolchain ]; then
            echo "==> 拷入内置工具链"
            cp -R Native/Resources/Toolchain "$APP/Toolchain"
            du -sh "$APP/Toolchain"
          else
            echo "::warning::产物不含内置工具链"
          fi

          # 局域网工作台的网页（不打进 Assets.car，直接当资源文件）
          if [ -d Native/Remote ]; then
            mkdir -p "$APP/Remote"
            cp -R Native/Remote/. "$APP/Remote/"
            echo "==> 已打包 Remote 网页"
          fi

          # 其它裸资源（json / strings / 配置）
          for f in Native/Resources/*; do
            base="$(basename "$f")"
            case "$base" in
              Info.plist|*.png|*.lproj|Assets.xcassets|Toolchain) continue ;;
            esac
            cp -R "$f" "$APP/" 2>/dev/null || true
          done

          # ---- 标准 .app 必备件 ----
          # PkgInfo：8 字节 "APPL????"，某些安装器据此判断是 App
          printf 'APPL????' > "$APP/PkgInfo"

          # Assets.car：xcrun actool 编译资源目录（图标 + 颜色 + 图标名义尺寸）
          if [ -d Native/Resources/Assets.xcassets ]; then
            echo "==> 编译 Assets.car"
            xcrun actool Native/Resources/Assets.xcassets \
              --compile "$APP" \
              --platform iphoneos \
              --minimum-deployment-target ${MIN} \
              --app-icon AppIcon \
              --output-partial-info-plist "$RUNNER_TEMP/asset-info.plist" \
              --errors --warnings --notices 2>&1 | tail -20
            # actool 会把 Assets.car 与 AppIcon*.png 一起产出到 $APP
            ls -lh "$APP/Assets.car" 2>/dev/null || echo "（actool 没产出 Assets.car，回退到扁平 png）"
          fi

          # 启动屏：iOS 15 起可用 Info.plist 的 UILaunchScreen，无需 storyboard
          plutil -insert UILaunchScreen -json '{}' "$APP/Info.plist" 2>/dev/null || true

          # 多语言：把 en.lproj 的本地化文件也带上（若有 zh-Hans 一并复制）
          for lproj in Native/Resources/*.lproj; do
            [ -d "$lproj" ] && cp -R "$lproj" "$APP/"
          done

          # 设置包（如果以后要加 App 内设置的系统入口）
          if [ -d Native/Resources/Settings.bundle ]; then
            cp -R Native/Resources/Settings.bundle "$APP/"
          fi

          echo "==> .app 结构"
          find "$APP" -maxdepth 1 | sort
          du -sh "$APP"

          FLAGS=(
            -target "${{ matrix.arch }}-apple-ios${MIN}"
            -isysroot "$SDK"
            -miphoneos-version-min=${MIN}
            -fobjc-arc -fmodules
            -O2 -DNDEBUG
            -INative/ObjC
            -Wno-deprecated-declarations
          )

          echo "==> 编译源文件"
          OBJECTS=()
          for f in Native/ObjC/*.m; do
            out="$RUNNER_TEMP/$(basename "${f%.m}").o"
            echo "    $f"
            xcrun clang "${FLAGS[@]}" -c "$f" -o "$out"
            OBJECTS+=("$out")
          done

          echo "==> 链接 (${{ matrix.arch }})"
          xcrun clang "${FLAGS[@]}" "${OBJECTS[@]}" \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
            -o "$APP/$SCHEME"

          # ------------------------------------------------------------------
          # 关键：TrollStore 用 `ldid -s Payload/Spark.app` 对整个目录签名，
          # 遇到 #! 开头的 shell 脚本会报 "Unknown header magic" 并整体失败。
          # 工具链里 egrep/fgrep/gunzip/gzexe/dpkg-realpath 都是脚本，
          # 去掉可执行位（编译不需要它们）。
          # ------------------------------------------------------------------
          echo "==> 降级 shell 脚本（避免 ldid -s 报 Unknown header magic）"
          # ------------------------------------------------------------------
          # 先处理符号链接：ldid -s 递归签名时读到符号链接会报
          # "Unknown header magic"，整个安装失败（实测踩过）。
          # 一律「实体化」：符号链接换成真实文件。
          # ------------------------------------------------------------------
          echo "==> 实体化符号链接（ldid -s 不认符号链接）"
          LINKS=$(find "$APP" -type l 2>/dev/null | wc -l | tr -d ' ')
          if [ "${LINKS:-0}" -gt 0 ]; then
            find "$APP" -type l 2>/dev/null > /tmp/links.txt
            while IFS= read -r l; do
              [ -n "$l" ] || continue
              tgt=$(readlink "$l")
              echo "  $l -> $tgt"
              rm -f "$l"
              if [ -e "$(dirname "$l")/$tgt" ]; then
                cp "$(dirname "$l")/$tgt" "$l"
              elif [ -e "$tgt" ]; then
                cp "$tgt" "$l"
              else
                echo "::warning::链接目标不存在，跳过 $l"
              fi
            done < /tmp/links.txt
            echo "  实体化 $LINKS 个"
          else
            echo "  无符号链接"
          fi

          # ------------------------------------------------------------------
          # 清理「空壳 bundle」：Theos vendor 里很多 framework 只有 .tbd 桩，
          # 没有真实二进制。ldid -s 会读 Info.plist 的 CFBundleExecutable
          # 然后去打开那个文件，找不到就报 "Unknown header magic"。
          # ------------------------------------------------------------------
          echo "==> 清理空壳 bundle"
          python3 scripts/fix-bundles.py "$APP" || echo "::warning::清理脚本失败"

          # 工具链里很多文件是只读的，chmod 前先加写权限
          chmod -R u+w "$APP" 2>/dev/null || true
          DEMOTED=0
          find "$APP" -type f -perm -u+x 2>/dev/null > /tmp/execlist.txt || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ "$(head -c 2 "$f" 2>/dev/null)" = '#!' ]; then
              chmod 644 "$f"
              echo "  - ${f#$APP/}"
              DEMOTED=$((DEMOTED + 1))
            fi
          done < /tmp/execlist.txt
          echo "  共降级 $DEMOTED 个"

          # 自检：签名前不允许再有任何 #! 可执行文件
          # 注意：set -e 下 while/&& 返回非零会让 $(...) 整体失败，
          # 所以先把残留写进文件再数，别用管道接 wc。
          : > /tmp/leftover.txt
          find "$APP" -type f -perm -u+x 2>/dev/null > /tmp/execlist2.txt || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ "$(head -c 2 "$f" 2>/dev/null)" = '#!' ]; then
              echo "$f" >> /tmp/leftover.txt
            fi
          done < /tmp/execlist2.txt
          LEFTOVER=$(wc -l < /tmp/leftover.txt | tr -d ' ')
          if [ "${LEFTOVER:-0}" -gt 0 ]; then
            echo "::error::仍有 $LEFTOVER 个 shell 脚本带可执行位，ldid -s 会失败"
            cat /tmp/leftover.txt
            exit 1
          fi
          echo "  ✓ 无残留脚本"

          # 空壳 bundle 复查（--check 只探测不修改，有问题退出 1）
          python3 scripts/fix-bundles.py --check "$APP"

          # 签名前只查完好性（此时主程序尚未签名，属正常）
          python3 scripts/check-macho.py --no-signature "$APP"

          # ------------------------------------------------------------------
          # 移出 ldid 处理不了的二进制（FAT 包 ar / 纯 ar 静态库）
          # theos/vendor/lib/libroot*.a 是 FAT 但内含 ar，ldid 会报
          # "Unknown header magic"，实测直接导致安装失败
          # ------------------------------------------------------------------
          echo "==> 移出非 Mach-O 二进制"
          python3 scripts/strip-non-macho.py "$APP"

          LINKLEFT=$(find "$APP" -type l 2>/dev/null | wc -l | tr -d ' ')
          if [ "${LINKLEFT:-0}" -gt 0 ]; then
            echo "::error::仍有 $LINKLEFT 个符号链接，ldid -s 会失败"
            find "$APP" -type l
            exit 1
          fi
          echo "  ✓ 无符号链接"

          # ------------------------------------------------------------------
          # 编译 Share Extension（必须在签名之前，且要在清空 App 之后）
          # ------------------------------------------------------------------
          # 注意：GITHUB_ENV 里写的 APP_PATH 在同一步内可用，但 $APP 是上一步的局部变量，
          # 这里重新算一遍，避免 unbound variable
          EXT="$APP/PlugIns/SparkShare.appex"
          rm -rf "$EXT" && mkdir -p "$EXT"

          cp ShareExtension/Info.plist "$EXT/"
          plutil -convert binary1 "$EXT/Info.plist"
          for lproj in ShareExtension/Native/Resources/*.lproj; do
            [ -d "$lproj" ] && cp -R "$lproj" "$EXT/"
          done

          FLAGS=(
            -target "${{ matrix.arch }}-apple-ios${MIN}"
            -isysroot "$SDK"
            -miphoneos-version-min=${MIN}
            -fobjc-arc -fmodules
            -O2 -DNDEBUG
            -Wno-deprecated-declarations
          )

          echo "==> 编译扩展"
          # .appex 必须链接成 dylib（MH_BUNDLE 由 -bundle 生成），
          # 并由 NSExtensionMain 作为入口（ShareExtension/main.m）
          xcrun clang "${FLAGS[@]}" \
            -bundle -fapplication-extension \
            -framework UIKit -framework Foundation -framework UniformTypeIdentifiers \
            -o "$EXT/SparkShare" \
            ShareExtension/main.m ShareExtension/SPShareViewController.m

          echo "==> 签名扩展（带 App Group）"
          if [ -f ShareExtension/entitlements.plist ]; then
            codesign --force --sign - --timestamp=none \
              --entitlements ShareExtension/entitlements.plist \
              --generate-entitlement-der "$EXT" || true
          else
            codesign --force --sign - --timestamp=none "$EXT" || true
          fi
          file "$EXT/SparkShare"
          du -sh "$EXT"

          # ------------------------------------------------------------------
          # 内置注入工具（来源：Lessica/TrollFools，MIT）
          # ct_bypass / insert_dylib / optool / CydiaSubstrate.framework
          # 放在 .app/bin 下，注入时优先用它们，不必依赖用户自备
          # ------------------------------------------------------------------
          echo "==> 安装内置注入工具"
          if [ -d Native/TrollTools ]; then
            mkdir -p "$APP/bin"
            cp Native/TrollTools/ct_bypass Native/TrollTools/insert_dylib \
               Native/TrollTools/optool "$APP/bin/" 2>/dev/null || true
            chmod 755 "$APP/bin/ct_bypass" "$APP/bin/insert_dylib" "$APP/bin/optool" 2>/dev/null || true
            if [ -d Native/TrollTools/CydiaSubstrate.framework ]; then
              mkdir -p "$APP/Frameworks"
              cp -R Native/TrollTools/CydiaSubstrate.framework "$APP/Frameworks/"
              chmod 755 "$APP/Frameworks/CydiaSubstrate.framework/CydiaSubstrate" 2>/dev/null || true
            fi
            ls -lh "$APP/bin"
          fi

          # ------------------------------------------------------------------
          # 编译 JIT helper（必须在签名之前：它是独立进程，要单独签名）
          # ------------------------------------------------------------------
          echo "==> 编译 JIT helper"
          mkdir -p "$APP/bin"
          xcrun clang -O2 -target arm64-apple-ios15.0 -isysroot "$SDK" \
            -miphoneos-version-min="${MIN}" \
            -o "$APP/bin/spark-jitd" Native/JIT/spark-jitd.c
          chmod 755 "$APP/bin/spark-jitd"
          file "$APP/bin/spark-jitd"

          # ------------------------------------------------------------------
          # Helper 必须单独签名！
          # bin/spark-jitd 是独立进程，继承不到主 App 的签名；
          # 不给它签，ldid -s 遍历到未签名的 Mach-O 就会报
          # "Unknown header magic"，导致 TrollStore 安装失败（实测踩坑）。
          # ------------------------------------------------------------------
          echo "==> 单独签名 Helper（用独立的 entitlements）"
          if [ -f Native/JIT/helper.entitlements.plist ]; then
            HELPER_ENT="Native/JIT/helper.entitlements.plist"
            plutil -lint "$HELPER_ENT"
            python3 scripts/check-entitlements.py "$HELPER_ENT" || {
              echo "::error::Helper entitlements 校验失败"; exit 1; }
          else
            HELPER_ENT="entitlements.plist"
          fi

          SIGNDIR="$APP/bin"
          if [ -d "$SIGNDIR" ]; then
            find "$SIGNDIR" -type f 2>/dev/null > /tmp/helpers.txt || true
            while IFS= read -r h; do
              [ -n "$h" ] || continue
              # 只签 Mach-O
              MAGIC=$(head -c 4 "$h" 2>/dev/null | od -An -tx1 | tr -d ' \n')
              case "$MAGIC" in
                cffaedfe|cefaedfe|feedfacf|feedface)
                  chmod 755 "$h"
                  echo "  签名 $(basename "$h")"
                  codesign --force --sign - --timestamp=none \
                    --entitlements "$HELPER_ENT" \
                    --generate-entitlement-der "$h" || {
                      echo "::error::Helper 签名失败：$h"; exit 1; }
                  ;;
                *) echo "  跳过（非 Mach-O）$(basename "$h")" ;;
              esac
            done < /tmp/helpers.txt
          fi
          echo "  ✓ Helper 签名完成"

          echo "==> 签名（带平台权限，TrollStore 必需）"
          # 关键：必须带 entitlements，否则 App 会跑在沙盒里、
          # 无法 exec 子进程 —— 编译和注入都会失效。
          if [ -f entitlements.plist ]; then
            plutil -lint entitlements.plist
            python3 scripts/check-entitlements.py entitlements.plist
            codesign --force --sign - --timestamp=none \
              --entitlements entitlements.plist \
              --generate-entitlement-der "$APP" || true
            echo "==> 校验签名权限"
            codesign -d --entitlements :- "$APP" 2>/dev/null | head -40 || true
          else
            codesign --force --sign - --timestamp=none "$APP" || true
          fi
          echo "==> 产物"
          du -sh "$APP"
          file "$APP/$SCHEME"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Share Extension：编译并塞进 .app/PlugIns/
      # 有了它，Spark 才会出现在其它 App 的「分享」菜单里
      # -----------------------------------------------------------------------
      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          V="${{ steps.info.outputs.version }}"
          A="${{ matrix.arch }}"
          ( cd "$(dirname "$APP_PATH")" && ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP_PATH")" "$GITHUB_WORKSPACE/out/${SCHEME}-${V}-${A}.app.zip" )
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          ( cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/${SCHEME}-${V}-${A}.ipa" Payload )
          ( cd out && shasum -a 256 * > SHA256SUMS.txt && ls -lh && cat SHA256SUMS.txt )

          echo "==> 自检：ipa 内容"
          unzip -l "out/${SCHEME}-${V}-${A}.ipa"
          for need in "Payload/${SCHEME}.app/Info.plist" "Payload/${SCHEME}.app/${SCHEME}" \
                      "Payload/${SCHEME}.app/AppIcon60x60@3x.png" "Payload/${SCHEME}.app/PkgInfo"; do
            unzip -l "out/${SCHEME}-${V}-${A}.ipa" | grep -q "$need" \
              || { echo "缺少必需文件: $need"; exit 1; }
          done
          if [ -d Native/Resources/Toolchain/bin ]; then
            unzip -l "out/${SCHEME}-${V}-${A}.ipa" | grep -q "Payload/${SCHEME}.app/Toolchain/bin/" \
              || { echo "缺少内置工具链"; exit 1; }
            echo "内置工具链已包含"
          fi
          echo "==> 校验 entitlements 是否带进包"
          unzip -p "out/${SCHEME}-${V}-${A}.ipa" "Payload/${SCHEME}.app/${SCHEME}" > /tmp/chk.bin
          if codesign -d --entitlements :- /tmp/chk.bin 2>/dev/null | grep -q "platform-application"; then
            echo "platform-application 已带上 ✓"
          else
            echo "::warning::可执行文件里没有 platform-application，TrollStore 里可能仍显示沙盒内运行"
          fi
          unzip -l "out/${SCHEME}-${V}-${A}.ipa" | grep -q "Payload/${SCHEME}.app/bin/spark-jitd" \
            && echo "JIT helper 已包含 ✓" \
            || echo "::warning::JIT helper 没进包"
          unzip -l "out/${SCHEME}-${V}-${A}.ipa" | grep -q "Payload/${SCHEME}.app/PlugIns/SparkShare.appex/SparkShare" \
            && echo "Share Extension 已包含 ✓" \
            || echo "::warning::Share Extension 没进包，分享菜单里不会出现 Spark"
          # 最终自检：ipa 里不能有 #! 可执行文件（否则用户装不上）
          chmod -R u+w /tmp/vfy 2>/dev/null || true
          rm -rf /tmp/vfy 2>/dev/null || true
          mkdir -p /tmp/vfy
          unzip -q "out/${SCHEME}-${V}-${A}.ipa" -d /tmp/vfy
          : > /tmp/badscript.txt
          find /tmp/vfy/Payload -type f -perm -u+x 2>/dev/null > /tmp/vfyexec.txt || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ "$(head -c 2 "$f" 2>/dev/null)" = '#!' ]; then
              echo "$f" >> /tmp/badscript.txt
            fi
          done < /tmp/vfyexec.txt
          BAD=$(wc -l < /tmp/badscript.txt | tr -d ' ')
          if [ "${BAD:-0}" -gt 0 ]; then
            echo "::error::ipa 里还有 $BAD 个 shell 脚本带可执行位，TrollStore 安装会失败"
            exit 1
          fi
          LK=$(find /tmp/vfy/Payload -type l 2>/dev/null | wc -l | tr -d ' ')
          if [ "${LK:-0}" -gt 0 ]; then
            echo "::error::ipa 里有 $LK 个符号链接，TrollStore 安装会失败"
            find /tmp/vfy/Payload -type l
            exit 1
          fi
          # 每个 Mach-O 都必须有 LC_CODE_SIGNATURE，否则 TrollStore 的 ldid -s 会失败
          if ! python3 scripts/strip-non-macho.py --check /tmp/vfy/Payload/Spark.app; then
            echo "::error::ipa 里仍有 ldid 处理不了的二进制"
            exit 1
          fi
          if ! python3 scripts/check-macho.py /tmp/vfy/Payload; then
            echo "::error::存在未签名的 Mach-O，ldid -s 会失败"
            exit 1
          fi

          echo "✓ 签名前检查通过：无 #! 可执行文件、无符号链接"
          # unzip 出来的文件权限是只读，清理前要先改权限
          chmod -R u+w /tmp/vfy 2>/dev/null || true
          rm -rf /tmp/vfy 2>/dev/null || true
          echo "ipa 结构检查通过"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spark-${{ steps.info.outputs.version }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        run: |
          {
            echo "## Spark 构建完成 :sparkles:"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`${{ steps.info.outputs.version }}\` |"
            echo "| git | \`${{ steps.info.outputs.git }}\` |"
            echo "| Bundle ID | \`com.HuQing.Spark\` |"
            echo "| 架构 | ${{ matrix.arch }} |"
            echo "| 触发任务 | \`${{ inputs.job_id }}\` |"
            echo "| runner | $(sw_vers -productName) $(sw_vers -productVersion) |"
            echo ""
            echo '### 产物'
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. 打 tag 时建 Release
  # ---------------------------------------------------------------------------
  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          name: Spark ${{ github.ref_name }}
