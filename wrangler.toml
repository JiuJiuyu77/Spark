# Cloudflare Worker：Spark 远程构建编排
#
# 部署：
#   npm i -g wrangler
#   wrangler kv namespace create JOBS        # 把返回的 id 填到下面
#   wrangler r2 bucket create spark-uploads
#   wrangler secret put TOKEN                # 自己定一个足够长的随机串
#   wrangler secret put GH_TOKEN             # GitHub PAT，需要 actions:write
#   wrangler deploy
#
# 手机端在「工具链 → 构建目标 → GitHub CI」里填 Worker 地址与 TOKEN。

name = "spark-worker"
main = "Workers/SPCloudWorker.js"
compatibility_date = "2024-11-01"

[vars]
GH_OWNER = "JiuJiuyu77"
GH_REPO = "Spark"
GH_WORKFLOW = "build.yml"
GH_REF = "main"
MAX_UPLOAD_MB = "32"
SP_VERSION = "1.0.0"

[[kv_namespaces]]
binding = "JOBS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "spark-uploads"

[observability]
enabled = true
